<!--
  Diagram: holes cut in the roof drop light onto the areas being highlighted.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Diagram of the arcade black box with holes cut in the roof, light shafts picking out the blocks below">
  <defs>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffeec2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffeec2" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#0a0a0c"/>
  <!-- black box shell -->
  <rect x="0" y="60" width="1600" height="660" fill="none" stroke="#1a1a1f" stroke-width="8"/>
  
  <!-- roof holes -->
  <rect x="600" y="60" width="60" height="26" fill="#f2e2b0"/>
  <rect x="780" y="60" width="60" height="26" fill="#f2e2b0"/>
  <rect x="960" y="60" width="60" height="26" fill="#f2e2b0"/>
  <!-- light shafts -->
  <g opacity="0.28">
    <polygon points="600,86 660,86 760,720 500,720" fill="url(#shaft)"/>
    <polygon points="780,86 840,86 940,720 680,720" fill="url(#shaft)"/>
    <polygon points="960,86 1020,86 1120,720 860,720" fill="url(#shaft)"/>
  </g>
