<!--
  Diagram: the black box with a sealed roof — nothing is picked out of the dark.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Diagram of the arcade black box with a sealed roof, everything sitting in darkness">
  <defs>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffeec2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffeec2" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#08080a"/>
  <!-- black box shell -->
  <rect x="0" y="60" width="1600" height="660" fill="none" stroke="#1a1a1f" stroke-width="8"/>
  
  <!-- sealed roof, no light holes -->
  <rect x="0" y="60" width="1600" height="26" fill="#121216"/>
  <rect y="700" width="1600" height="200" fill="#0d0d10"/>
